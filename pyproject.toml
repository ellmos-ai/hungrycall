[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hungrycall"
version = "0.1.0"
description = "HungryCall — Automated voice cascade agent for food delivery, reservations, and pickup."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HungryCall Hackathon Team"}
]
dependencies = []

[project.optional-dependencies]
# Only for the AWS Lambda dry-run demo (demo/lambda_entry.py). Mangum adapts
# the same FastAPI app to a Function URL event; uvicorn is not part of this
# extra because Lambda never runs an ASGI server of its own, and neither is
# jinja2 because hungrycall/templates.py builds its HTML itself.
lambda = ["fastapi>=0.110", "python-multipart>=0.0.9", "mangum>=0.17", "httpx>=0.27"]

[project.scripts]
hungrycall = "hungrycall.cli:main"
hungrycall-web = "hungrycall.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"
]
ignore = [
    "E501",   # Line length handled by formatter / docstrings
    "SIM108", # ternary operator can reduce readability in complex cases
    "RUF001", # ambiguous characters in strings (like multiplication sign ×)
    "RUF002", # ambiguous characters in docstrings (like en-dash –)
    "RUF003", # ambiguous characters in comments
]


